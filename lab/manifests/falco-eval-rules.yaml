# Custom Falco rules for the eval sandbox.
#
# IMPORTANT LESSON (verified on a live A10 kind cluster): Falco's HOST eBPF probe gets the
# container *id* from cgroups but NOT image/pod metadata unless it is enriched from the CRI
# socket. So image- or namespace-keyed rules SILENTLY NEVER MATCH here. We therefore key on the
# built-in `container` macro (container.id != host), which uses the cgroup id Falco always has.
# In this lab the only workload container is the eval sandbox, so that is precise enough.
#
# SECOND LESSON: a workload running under gVisor is INVISIBLE to these host rules — its syscalls
# are handled in user space by runsc and never reach the host kernel. Against a gVisor pod, Falco
# instead sees runsc's own PTRACE_ATTACH. The fix in production is Falco's gVisor integration
# (Falco reads gVisor's intercepted syscalls), not the host probe. The runc pod is where these
# fire; the contrast IS the point.

- rule: Shell spawned in a workload container
  desc: A shell started inside a container. In this lab the only workload is the eval sandbox.
  condition: >
    spawned_process and container and proc.name in (shell_binaries)
  output: >
    Shell spawned in workload container (cid=%container.id img=%container.image.repository
    proc=%proc.cmdline parent=%proc.pname user=%user.name)
  priority: WARNING
  tags: [eval, breakout, mitre_execution]

- rule: Outbound connection from a workload container
  desc: A container made an outbound connection; the eval sandbox should have no egress.
  condition: >
    (evt.type = connect and evt.dir = < and fd.l4proto in (tcp, udp))
    and container and fd.sip != "127.0.0.1"
  output: >
    Outbound connection from workload container (cid=%container.id dest=%fd.sip:%fd.sport
    img=%container.image.repository proc=%proc.cmdline)
  priority: WARNING
  tags: [eval, breakout, exfiltration]
